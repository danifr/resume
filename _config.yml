# Site settings
title: "Daniel Fernández Rodríguez"
description: "SRE & Cloud Platform Engineer based in Geneva"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Daniel Fernández Rodríguez"
resume_title:                   "Cloud Platform Engineer with <span class='heart'>🖤</span> for open source"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "danielfr@outlook.com"

# used for schema itemprop in _layouts/resume.html
resume_contact_address:         "Geneva, Switzerland"

resume_header_contact_info:     "✦ Geneva, Switzerland • danielfr@outlook.com"
display_header_contact_info:    "true"

resume_header_intro: '<p id="terminal-intro" class="terminal-intro"><span class="terminal-prompt">$&gt;</span> <span id="typed-cmd"></span><span id="cursor" class="terminal-cursor">█</span><br><span id="typed-text"></span></p>'

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_research:        true
resume_section_projects:        true
resume_section_skills:          true
#resume_section_recognition:     true
#resume_section_links:           true
#resume_section_associations:    true
#resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/danifr"
  resume_twitter_url:           "https://twitter.com/dafero"
  #resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/dafero"
  # resume_instagram_url:         "insert your Instagram URL here"
  #resume_website_url:           "http://joelglovier.com"
  #resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

